%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/riscv,fsl-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RISC-V FSL Watchdog Timer

maintainers:
  - support@nucleisys.com

description: |
  Watchdog timer for Nuclei UX600 series SoCs. This watchdog
  timer is based on the Freescale watchdog controller design.

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    oneOf:
      - const: riscv,fsl-wdt
      - items:
          - enum:
              - nuclei,ux600-wdt
              - nuclei,ux600fd-wdt
          - const: riscv,fsl-wdt

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: hfclk

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    watchdog@68000000 {
        compatible = "nuclei,ux600fd-wdt", "riscv,fsl-wdt";
        reg = <0x0 0x68000000 0x0 0x20>;
        interrupt-parent = <&plic0>;
        interrupts = <8>;
        clocks = <&hfclk>;
        status = "okay";
    };

...
