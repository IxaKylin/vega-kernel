%YAML 1.2
---
$id: http://devicetree.org/schemas/net/fsl,fsl-mac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale FSL MAC Ethernet Controller

maintainers:
  - support@nucleisys.com

description: |
  FSL MAC Ethernet controller used in Nuclei UX600 series SoCs.
  This is a 10/100/1000 Mbps Ethernet MAC controller.

allOf:
  - $ref: ethernet-controller.yaml#

properties:
  compatible:
    oneOf:
      - const: fsl,fsl-mac
      - items:
          - enum:
              - nuclei,ux600-mac
              - nuclei,ux600fd-mac
          - const: fsl,fsl-mac

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 3
    description: |
      Interrupt specifications. May have up to 3 interrupts for
      TX, RX, and error conditions.

  interrupt-names:
    minItems: 1
    maxItems: 3

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: hfclk

  num-cs: true

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    mac: ethernet@67800000 {
        compatible = "nuclei,ux600fd-mac", "fsl,fsl-mac";
        reg = <0x0 0x67800000 0x0 0x1000>;
        interrupt-parent = <&plic0>;
        interrupts = <10>, <11>, <12>;
        clocks = <&hfclk>;
        num-cs = <1>;
        #address-cells = <1>;
        #size-cells = <0>;
        status = "okay";
    };

...
