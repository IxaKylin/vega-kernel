%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/riscv,plic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RISC-V Platform-Level Interrupt Controller (PLIC)

maintainers:
  - support@nucleisys.com

description: |
  RISC-V SOC includes an implementation of the Platform-Level Interrupt
  Controller (PLIC) as specified in the RISC-V Privileged Architecture
  specification. The PLIC connects all external interrupts in the system
  to all hart contexts in the system, via the external interrupt source
  in each hart.

  A hart context is a privilege mode in a hardware execution thread.
  For example, in an 4 core system with 2-way SMT, you have 8 harts
  and probably at least two privilege modes per hart; machine mode and
  supervisor mode.

  Each interrupt can be enabled on per-context basis. Any context can
  claim a pending enabled interrupt and then release it once it has
  been handled.

  Each interrupt has a configurable priority. Higher priority interrupts
  are serviced first. Each context can specify a priority threshold.
  Interrupts with priority below this threshold will not cause the PLIC
  to raise its interrupt line leading to the context.

allOf:
  - $ref: /schemas/interrupt-controller.yaml#

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - sifive,fu540-c000-plic
              - nuclei,ux600-plic
              - nuclei,ux600fd-plic
          - const: sifive,plic-1.0.0
      - const: riscv,plic0

  reg:
    maxItems: 1

  interrupts-extended:
    minItems: 1
    description: |
      Specifies which contexts are connected to the PLIC. Each node
      pointed to should be a riscv,cpu-intc node.

  riscv,ndev:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Specifies how many external interrupts are supported by this
      controller.

  interrupt-controller: true

  "#interrupt-cells":
    const: 1

  "#address-cells":
    const: 0

required:
  - compatible
  - reg
  - interrupt-controller
  - "#interrupt-cells"
  - riscv,ndev
  - interrupts-extended

additionalProperties: false

examples:
  - |
    plic0: interrupt-controller@8000000 {
        compatible = "nuclei,ux600-plic", "sifive,plic-1.0.0";
        reg = <0x0 0x8000000 0x0 0x4000000>;
        interrupt-controller;
        #interrupt-cells = <1>;
        riscv,ndev = <53>;
        interrupts-extended = <&cpu0_intc 11 &cpu0_intc 9>;
    };

...
